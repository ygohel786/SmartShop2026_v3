<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SmartShop Manager{% endblock %}</title>
    
    <!-- Tailwind CSS (નવી અને ક્લીન ડિઝાઇન માટે) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- HTMX (ફાસ્ટ અને ડાયનેમિક પેજ માટે) -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    
    <!-- Google Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body class="flex h-screen overflow-hidden">

    <!-- ડાબી બાજુનું સુંદર સાઇડબાર (Sidebar) -->
    <aside class="w-64 bg-indigo-900 text-white flex flex-col">
        <div class="h-16 flex items-center justify-center border-b border-indigo-800">
            <h1 class="text-2xl font-bold tracking-wider">SmartShop</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2">
            <!-- Dashboard Link -->
            <a href="{% url 'home' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg transition hover:bg-indigo-800 {% if request.resolver_match.url_name == 'home' %}bg-indigo-800{% endif %}">
                <span class="material-icons">dashboard</span>
                <span>Dashboard</span>
            </a>
            
            <!-- Inventory Link (જો તમે URL નું નામ inventory રાખ્યું હોય તો) -->
            <a href="{% url 'inventory' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg transition hover:bg-indigo-800 {% if request.resolver_match.url_name == 'inventory' %}bg-indigo-800{% endif %}">
                <span class="material-icons">inventory_2</span>
                <span>Inventory</span>
            </a>
            
            <!-- Point of Sale (Billing) Link -->
            <a href="{% url 'sales' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg transition hover:bg-indigo-800 {% if request.resolver_match.url_name == 'sales' %}bg-indigo-800{% endif %}">
                <span class="material-icons">point_of_sale</span>
                <span>Point of Sale</span>
            </a>
            
            <!-- Analysis Link -->
            <a href="{% url 'analysis' %}" class="flex items-center gap-3 px-4 py-3 rounded-lg transition hover:bg-indigo-800 {% if request.resolver_match.url_name == 'analysis' %}bg-indigo-800{% endif %}">
                <span class="material-icons">analytics</span>
                <span>Analysis</span>
            </a>
        </nav>
        
        <!-- Logout Link -->
        <div class="p-4 border-t border-indigo-800">
            <a href="{% url 'logout' %}" class="flex items-center gap-3 px-4 py-2 text-indigo-200 hover:text-white transition">
                <span class="material-icons">logout</span>
                <span>Logout</span>
            </a>
        </div>
    </aside>

    <!-- જમણી બાજુનો મુખ્ય ભાગ (Main Content) -->
    <div class="flex-1 flex flex-col">
        
        <!-- ઉપરનું હેડર (Top Header) -->
        <header class="h-16 bg-white shadow-sm flex items-center justify-between px-8">
            <h2 class="text-xl font-semibold text-gray-800">{% block header_title %}Welcome{% endblock %}</h2>
            <div class="flex items-center gap-4">
                <span class="material-icons text-gray-500">notifications</span>
                <div class="h-8 w-8 bg-indigo-100 text-indigo-700 rounded-full flex items-center justify-center font-bold">
                    Y
                </div>
            </div>
        </header>

        <!-- પેજનો અંદરનો ડેટા (Dynamic Content) -->
        <main class="flex-1 p-8 overflow-y-auto">
            
            <!-- મેસેજ બતાવવા માટે -->
            {% if messages %}
                <div class="mb-4">
                    {% for msg in messages %}
                        <div class="p-4 rounded-lg {% if msg.tags == 'error' %}bg-red-100 text-red-700{% else %}bg-green-100 text-green-700{% endif %}">
                            {{ msg }}
                        </div>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- દરેક પેજનો કોડ અહીં આવશે -->
            {% block content %}
            {% endblock %}
            
        </main>
    </div>

</body>
</html>
