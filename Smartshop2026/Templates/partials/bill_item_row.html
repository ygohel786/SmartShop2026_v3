<tr class="hover:bg-gray-50 transition">
    <td class="py-3 px-4 text-sm text-gray-800">
        <span class="bg-gray-100 text-gray-600 px-2 py-1 rounded text-xs">{{ product.category.name }}</span>
        <div class="font-medium mt-1">{{ product.name }}</div>
    </td>
    <td class="py-3 px-4 text-sm text-gray-800 font-medium">
        {{ quantity }}
        <input type="hidden" name="billed_items" value="{{ product.id }}_{{ quantity }}">
    </td>
    <td class="py-3 px-4 text-sm text-gray-500">₹{{ product.selling_price }}</td>
    <td class="py-3 px-4 text-sm font-bold text-gray-800">₹{{ sub_total }}</td>
    <td class="py-3 px-4 text-center">
        <button type="button" class="text-red-500 hover:text-red-700 hover:bg-red-50 p-2 rounded-full transition" onclick="this.closest('tr').remove(); calculateTotal();">
            <span class="material-icons text-xl">delete</span>
        </button>
    </td>
</tr>
