{% extends 'base.html' %}
{% block content %}
<div class="p-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-8">AI Sales Prediction & Analysis</h2>

    <!-- Data Loading Spinner -->
    <div id="loading" class="text-indigo-600 font-bold mb-4 flex items-center gap-2">
        <span class="material-icons animate-spin">sync</span>
        🤖 AI is analyzing your sales data... Please wait...
    </div>

    <!-- Suggestions Table -->
    <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden hidden" id="suggestions-container">
        <table class="w-full text-left border-collapse">
            <thead>
                <tr class="bg-gray-50 text-gray-600 border-b border-gray-200 text-sm uppercase tracking-wider">
                    <th class="p-4 font-semibold">Product Name</th>
                    <th class="p-4 font-semibold">Category</th>
                    <th class="p-4 font-semibold">Next Month Prediction (Qty)</th>
                    <th class="p-4 font-semibold">Avg Selling Price</th>
                </tr>
            </thead>
            <tbody class="text-gray-700" id="suggestions-body">
                <!-- JavaScript થી ડેટા અહીં ઓટોમેટિક આવશે -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // પેજ લોડ થાય એટલે તરત જ બેકએન્ડમાંથી AI નો ડેટા મંગાવશે
    document.addEventListener("DOMContentLoaded", function() {
        fetch("{% url 'overall' %}")
        .then(response => response.json())
        .then(data => {
            // લોડિંગ મેસેજ બંધ કરો
            document.getElementById("loading").style.display = "none";

            // જો એરર આવે (દા.ત. બિલ ના હોય તો)
            if (data.error) {
                document.getElementById("suggestions-container").classList.remove("hidden");
                document.getElementById("suggestions-body").innerHTML = `<tr><td colspan="4" class="p-4 text-red-500 font-bold">${data.error}</td></tr>`;
                return;
            }

            // જો ડેટા આવી જાય તો તેને ટેબલમાં ગોઠવો
            let tbody = document.getElementById("suggestions-body");
            data.buying_suggestions.forEach(item => {
                let row = `<tr class="border-b border-gray-50 hover:bg-gray-50 transition">
                    <td class="p-4 font-medium">${item.ProductName}</td>
                    <td class="p-4">${item.CategoryName}</td>
                    <td class="p-4 font-bold text-indigo-600">📦 ${item.Predicted_Next_Month_Sales} Units</td>
                    <td class="p-4 text-green-600">₹${item.SellingPrice}</td>
                </tr>`;
                tbody.innerHTML += row;
            });
            // ટેબલને સ્ક્રીન પર બતાવો
            document.getElementById("suggestions-container").classList.remove("hidden");
        })
        .catch(error => {
            document.getElementById("loading").innerHTML = "<span class='text-red-500'>Error loading predictions.</span>";
        });
    });
</script>
{% endblock %}
